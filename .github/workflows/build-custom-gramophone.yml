name: Build custom Gramophone APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-kiosk:
    name: Android kiosk APK (without debug diagnostics)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout including media3 submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Mark package as self-built
        run: printf 'releaseType=SelfBuilt\nappIdOverride=org.akanework.gramophone.kiosk\n' > package.properties

      - name: Compile Android kiosk app
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleKiosk --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Gramophone-Kiosk-APK
          path: app/build/outputs/apk/kiosk/*.apk
          if-no-files-found: error
