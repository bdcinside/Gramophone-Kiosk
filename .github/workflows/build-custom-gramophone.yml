name: Build custom Gramophone APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout including media3 submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Mark package as self-built
        run: printf 'releaseType=SelfBuilt\n' > package.properties

      - name: Compile Android debug app
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Gramophone-Custom-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
